[project]
name = "ha-velux-active-dev"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
test = [
  "aiohttp",
  "cryptography",
  "pyatmo==9.4.0",
  "pytest",
  "pytest-asyncio",
  "voluptuous",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

name: Validate and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Release
    needs:
      - hacs
      - hassfest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_tag="$(
            git tag --points-at "$GITHUB_SHA" --list "v*" \
              | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [ -n "$existing_tag" ]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(
            git tag --list "v*" \
              | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        if: steps.version.outputs.create == 'true'
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          commits_file="$RUNNER_TEMP/release-commits.txt"

          if [ -n "$PREVIOUS_TAG" ]; then
            git log --no-merges --reverse --pretty=format:"- %s (%h)" \
              "${PREVIOUS_TAG}..${GITHUB_SHA}" > "$commits_file"
          else
            git log --no-merges --reverse --max-count=1 --pretty=format:"- %s (%h)" \
              "$GITHUB_SHA" > "$commits_file"
          fi

          {
            echo "## Changes"
            echo

            if [ ! -s "$commits_file" ]; then
              echo "- Maintenance release"
            else
              cat "$commits_file"
              echo
            fi

            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
            fi
          } > "$notes_file"

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        if: steps.version.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.tag }}"
          version="${version#v}"

          tmp_file="$(mktemp)"
          jq --arg version "$version" '.version = $version' \
            custom_components/velux_active/manifest.json > "$tmp_file"
          mv "$tmp_file" custom_components/velux_active/manifest.json

      - name: Commit manifest version
        id: manifest_commit
        if: steps.version.outputs.create == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump manifest version to ${{ steps.version.outputs.tag }}"
          file_pattern: custom_components/velux_active/manifest.json

      - name: Create GitHub release
        if: steps.version.outputs.create == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.manifest_commit.outputs.commit_hash || github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
